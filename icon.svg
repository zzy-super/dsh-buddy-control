<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Buddy control">
  <defs>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#22c1a4"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="#0f172a"/>
  <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="none" stroke="url(#deck)" stroke-width="2"/>
  <!-- control deck -->
  <rect x="10" y="9" width="28" height="9" rx="3" fill="url(#deck)"/>
  <circle cx="15.5" cy="13.5" r="1.7" fill="#0f172a"/>
  <path d="M20 13.5h13" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
  <!-- two workers -->
  <rect x="7" y="28" width="14" height="11" rx="3" fill="none" stroke="#8fb0ff" stroke-width="2"/>
  <rect x="27" y="28" width="14" height="11" rx="3" fill="none" stroke="#8fb0ff" stroke-width="2"/>
  <!-- dispatch links -->
  <path d="M20 18v4.5M28 18v4.5" stroke="#8fb0ff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M14 22.5h20" stroke="#8fb0ff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M14 22.5v3.5M34 22.5v3.5" stroke="#8fb0ff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- acceptance tick -->
  <circle cx="34" cy="20" r="5.5" fill="#22c1a4"/>
  <path d="M31.4 20.1l1.9 1.9 3.4-3.6" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
